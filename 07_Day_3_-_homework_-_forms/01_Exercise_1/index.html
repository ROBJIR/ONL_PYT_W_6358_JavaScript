<!DOCTYPE html>
<html lang="en_US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>JavaScript - Homework</title>
  <script src="https://fer-api.coderslab.pl/bootstrap/js/index.js"></script>
  <script>new CL({
    title: "JavaScript - Homework",
    path: ["Day 4", "Exercise 1"]
  });</script>
</head>
<body>

<main class="container">

  <div class="row">
    <div class="col">
      <div class="card">
        <div class="card-body">
          <form>
            <div class="form-group form-check">
              <input class="form-check-input" type="checkbox" data-price="3.50" id="cheese">
              <label class="form-check-label" for="cheese">Extra cheese <span class="badge badge-dark">$ 3,50</span></label>
            </div>
            <div class="form-group form-check">
              <input class="form-check-input" type="checkbox" data-price="2.20" id="sauce">
              <label class="form-check-label" for="sauce">Extra sauce <span class="badge badge-dark">$ 2,20</span></label>
            </div>
            <div class="form-group form-check">
              <input class="form-check-input" type="checkbox" data-price="5.00" id="ham">
              <label class="form-check-label" for="ham">Extra ham <span class="badge badge-dark">$ 5</span></label>
            </div>
            <div class="form-group form-check">
              <input class="form-check-input" type="checkbox" data-price="4.10" id="pineapple">
              <label class="form-check-label" for="pineapple">Pineapple <span class="badge badge-dark">$ 4,10</span></label>
            </div>
            <div class="form-group form-check">
              <input class="form-check-input" type="checkbox" data-price="3.50" id="mushrooms">
              <label class="form-check-label" for="mushrooms">Portobellos <span class="badge badge-dark">$ 3,50</span></label>
            </div>

            <div class="btn-group mt-2">
              <button type="button" class="btn btn-secondary">All toppings</button>
              <button type="button" class="btn btn-secondary">Clear</button>
              <button type="submit" class="btn btn-primary float-right">Order</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="col" style="max-width: 300px;">
      <div class="card bg-light">
        <div class="card-header">Summary</div>
        <div class="card-body">
          <h5 class="card-title">Toppings</h5>
          <p class="card-text">Amount for toppings: <span id="price" class="badge badge-primary">$ 0</span></p>
          <p class="card-text order-info"></p>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="js/app.js" type="text/javascript"></script>
</body>
</html>
